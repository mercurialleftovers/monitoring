{% extends "base.html" %}

{% block content %}
{% if devices | length > 0 %}
	{% for device in devices %}
	<div class ="deviceList border rounded p-1 grid grid-cols-1 sm:grid-cols-2 h-full w-full m-2">

		<div class="deviceCard w-fit">
			<!-- name and devicename + pic -->
			<div class = "deviceContainer border rounded p-2 gap-2 flex flex-col items-center sm:flex-row  w-lg">
				<img class="w-60 h-60 border p-1" src="{{url_for('static', path='images/devices_images')}}/{{device.tag}}"  alt="{{device.name}}'s profile pic'"/>

				<div class="flex flex-col gap-1 border p-1 grow">
					<span>{{device.name}}</span>
					<span>{{device.category.value}}</span>
					<span>@{{device.tag}}</span>
					<span>Department: {{device.department.value}}</span>
				</div>

			</div>

	</div>

	</div>
	{% endfor %}
{%else%}
	<div>no devices yet 😊</div>
{%endif%}
{% endblock %}
