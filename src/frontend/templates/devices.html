{% extends "base.html" %}

{% block content %}
{% if devices | length > 0 %}
	{% for device in devices %}
	<div class ="userList border rounded p-1 grid">

		<div class="deviceCard">
			<!-- name and devicename + pic -->
			<div class = "deviceContainer border rounded p-2 gap-1 flex flex-col w-lg">
				<div class="flex flex gap-1 items-center">
					<img class="w-8" src="{{url_for('static', path='images/devices_images')}}/{{device.tag}}"  alt="{{device.name}}'s profile pic'"/>
					<span>{{device.category}}@{{device.department}}</span>
				</div>
			</div>

	</div>

	</div>
	{% endfor %}
{%else%}
	<div>no devices yet 😊</div>
{%endif%}
{% endblock %}
