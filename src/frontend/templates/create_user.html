{% extends "base.html" %}

{% block content %}

<form action="{{url_for('register_user_api')}}" method="post" enctype="multipart/form-data" class="border rounded p-8 m-4 grid sm:grid-cols-2 items-center justify-center gap-4">
	<label for="username">username</label>
	<input name="username"  class="border rounded"/>

	<label for="lastname">lastname</label>
	<input name="lastname"  class="border rounded"/>

	<label for="password">password</label>
	<input name="password"  type="password" class="border rounded"/>

	<label for="firstname">firstname</label>
	<input name="firstname"  class="border rounded"/>

	<label for="phone">phone</label>
	<input name="phone"  class="border rounded"/>

	<label for="email">email</label>
	<input name="email"  class="border rounded"/>

	<label for="role">role</label>
	<select name="role" class="border rounded p-1">
		{% for role in roles %}
		<option value="{{role}}">{{role}}</option>
		{% endfor %}
	</select>

	<div class="col-span-2 flex justify-center">
		<input name="profile_pic" type="file" accept="image/*" value="choose a picture" class="border rounded p-1 hover:bg-orange-200 hover:mouse:hand h-40 w-40" />
	</div>

	<!-- <div class="flex justify-center"> -->
	<!-- 	<div class="rounded border p-1"> -->
	<!-- 		img preview -->
	<!-- 	</div> -->
	<!-- </div> -->

	<input type="submit" value="register" class="border rounded p-1 bg-blue-200 col-span-2"/>
</form>

{% endblock %}
