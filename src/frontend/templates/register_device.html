{% extends "base.html" %}

{% block content %}

<form action="{{url_for('register_device_api')}}" method="post" enctype="multipart/form-data" class="border rounded p-8 m-4 grid sm:grid-cols-2 items-center justify-center gap-4">
	<label for="name">name</label>
	<input name="name"  class="border rounded"/>

	<label for="tag">tag</label>
	<input name="tag" class="border rounded"/>

	<label for="category">device type</label>
	<select name="category" class="border rounded p-1">
		{% for category in categories %}
		<option value="{{category}}">{{category}}</option>
		{% endfor %}
	</select>

	<label for="department">department</label>
	<select name="department" class="border rounded p-1">
		{% for department in departments %}
		<option value="{{department}}">{{department}}</option>
		{% endfor %}
	</select>


	<div class="col-span-2 flex justify-center">
		<input name="device_image" type="file" accept="image/*" value="choose a picture" class="border rounded p-1 hover:bg-orange-200 hover:mouse:hand h-40 w-40" />
	</div>

	<input type="submit" value="register" class="border rounded p-1 bg-blue-200 col-span-2"/>
</form>

{% endblock %}
