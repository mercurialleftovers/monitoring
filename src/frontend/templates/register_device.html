{% extends "base.html" %}

{% block content %}

<form action="{{url_for('register_device_api')}}" method="post" enctype="multipart/form-data" class="border rounded p-8 m-4 grid sm:grid-cols-2 items-center justify-center gap-4">
	<label for="name">🏷name</label>
	<input name="name"  class="px-2 border rounded"/>

	<label for="tag">🔗tag</label>
	<input name="tag"  class="px-2 border rounded"/>


	<label for="category">🖥device type</label>
	<select name="category" class="border rounded p-1">
		{% for category in categories %}
		<option value="{{category}}">{{category}}</option>
		{% endfor %}
	</select>

	<label for="department">🏦department</label>
	<select name="department" class="border rounded p-1">
		{% for department in departments %}
		<option value="{{department}}">{{department}}</option>
		{% endfor %}
	</select>

	<div class="col-span-2 flex flex-col items-center border rounded p-2 gap-2">
		<!-- <input name="device_image" type="file" accept="image/*" value="choose a picture" class="border border-black rounded p-1 hover:bg-orange-200 hover:text-orange-200 hover:mouse:hand h-40 w-40 text-white" bg-[url({{url_for('static', path='images/default/user.svg')}})]"/> -->
		<input name="device_image" type="file" accept="image/*" value="choose a picture" class="border border-black rounded p-1 hover:bg-orange-200 hover:text-orange-200 hover:mouse:hand h-40 w-40 text-white bg-contain" style="background-image: url({{url_for('static', path='images/default/user.svg')}})"/>
		<div class="selectFileButton border rounded p-2 hover:bg-green-200 w-full text-center">📷 image here</div>
	</div>

	<input type="submit" value="💾register" class="border rounded p-1 bg-blue-200 col-span-2"/>
</form>

<script src="{{url_for('static', path='js/form.js')}}"></script>
{% endblock %}
