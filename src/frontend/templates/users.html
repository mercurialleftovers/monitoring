{% extends "base.html" %}

{% block content %}
	{% for user in users %}
	<div class ="userList border rounded p-1 grid sm:grid-cols-2">

		<div class="userCard grid">
			<!-- name and username + pic -->
			<div class = "userContainer border rounded p-2 gap-1 flex flex-col w-lg">
				<div class="flex flex gap-1 items-center">
					<img class="w-8 h-8" src="{{url_for('static', path='images/profile_pics')}}/{{user.username}}"  alt="{{user.username}}'s profile pic'"/>
					<span>{{user.firstname}} {{user.lastname}}</span>
				</div>
				<span class="text-gray-600">@{{user.username}}</span>
				<span>{{user.role.value}} @ ADE</span>
			</div>
	</div>

	</div>
	{% endfor %}
{% endblock %}
