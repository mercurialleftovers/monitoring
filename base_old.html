
							  <div class ="device" id="device_{{device.id}}">

								  <div class="deviceCard">

									  <div class="stateCard inactive">
										  <img class="stateImg" src="static/images/icons/flag-red.svg" alt="inactive"/>
										  <!-- <p class="stateText">inactive</p> -->
									  </div>

									  <a href="/device/info/{{device.id}}" target="_blank">
										  <div class="nameButton">
											  <img src="static/device_types/{{category.value | lower}}.png" alt="{{category.value | lower}}">
											  <h3>{{device.deviceName}}</h3>
										  </div>
									  </a>

									  <p>identifier: {{device.identifier}}</p>

								  </div>

								  <p>department:<a href="/device/bydepartment/{{device.department.value}}" target="_blank"> {{device.department.value}}</a></p>
								  <p>category: <a href="/device/bycategory/{{device.category.value}}" target="_blank"> {{device.category.value}}</a></p>

								  <div class="monitorCard">
									  <p>Temperature:</p>
									  <p class="measurment" id="device_{{device.id}}_temperature">temperature_value_here</p>
									  <p>Vibration:</p>
									  <p class="measurment" id="device_{{device.id}}_vibration">vibration_value_here</p>
								  </div>
									<a href="/devices/control/{{device.id}}" target="_blank">
										<div class="settings">
											<img class="buttonIcon" src="static/images/icons/settings.svg" alt="settings"/>
											<span>settings</span>
										</div>
									</a>
							  </div>
